[package]
name = "repere"
version = "0.1.0"
description = "Local-first data pipeline explorer"
authors = ["mattis"]
license = "MIT"
repository = "https://github.com/mattis/repere"
edition = "2021"
rust-version = "1.77.2"
default-run = "repere"

[lib]
name = "repere_lib"
crate-type = ["lib"]

[[bin]]
name = "repere-benchmark"
path = "src/bin/benchmark.rs"

[features]
default = []  # Dev: use system DuckDB for fast builds
bundled = ["duckdb/bundled"]  # Release: statically link DuckDB

# Fast dev builds: skip debug info, optimize dependencies
[profile.dev]
opt-level = 0
debug = 0
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.libduckdb-sys]
opt-level = 3

[profile.release]
codegen-units = 16
strip = true

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
duckdb = "1.1"
calamine = "0.26"
chrono = "0.4"
base64 = "0.22"
tempfile = "3"
